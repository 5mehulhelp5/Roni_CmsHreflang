# Which Magento website / store view answers which host (QA only). *.localhost resolves to the loopback in Chromium-based browsers.
map $http_host $MAGE_RUN_CODE {
    default                '';
    hreflang-b.localhost   b_site;
    b-pt.localhost         b_pt;
    pt.localhost           pt;
    es.localhost           es;
    fr.localhost           fr;
}
map $http_host $MAGE_RUN_TYPE {
    default                '';
    hreflang-b.localhost   website;
    b-pt.localhost         store;
    pt.localhost           store;
    es.localhost           store;
    fr.localhost           store;
}
